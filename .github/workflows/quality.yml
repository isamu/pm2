name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint / format / typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  macos-units:
    # The e2e suite runs in Docker and cannot, so this is what covers path handling on a
    # non-Linux, non-Windows host. test:bpm is deliberately not here: its OpenTelemetry span
    # test waits on a live trace and fails locally too, and it has never run in CI.
    name: unit tests (macos)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install

      # InteractorClient writes agent.pid straight into PM2_HOME and expects it to be there
      # already. A fresh runner has no ~/.pm2, so the suite fails before it starts.
      - run: mkdir -p "$HOME/.pm2"

      - run: npm run test:io-agent
