# Generated by ever-better. Report-only — knip lists the whole inventory and cannot say what
# THIS pull request orphaned. Every rule in knip.json is `warn`, so the exit code stays zero.
name: dead-code-scan

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - 'knip.json'
      - 'package.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dead-code-scan:
    name: Dead Code Scan (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install

      - name: Run knip
        run: |
          set -euo pipefail
          {
            echo '## knip'
            echo
            echo '```'
            npm run knip || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
