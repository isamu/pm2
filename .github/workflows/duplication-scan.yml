# Generated by ever-better. Report-only: a check that cannot point at what THIS diff added
# must not gate, or the first false failure teaches everyone to reach for an ignore comment.
name: duplication-scan

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplication-scan:
    name: Duplication Scan (jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # required to upload SARIF
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run jscpd
        run: |
          set -euo pipefail
          npx --yes jscpd@4 . \
            --format "typescript,javascript,jsx,tsx,vue" \
            --ignore "**/node_modules/**,**/dist/**,**/build/**,**/*.d.ts,examples/**,test/fixtures/**" \
            --reporters console,sarif \
            --output report

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report/jscpd-sarif.json
          category: jscpd
