# Generated by ever-better. Its own workflow on purpose: adding a step to a pipeline this
# tool did not write would mean editing YAML it cannot parse.
name: ever-better

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ever-better check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install

      - name: ever-better check
        run: npx --yes ever-better check --no-write
